name: iOS app

on:
  push:
    branches: [ios-app]
  workflow_dispatch:

permissions:
  contents: write

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  BUNDLE_ID: io.github.mammadibir.hifz

jobs:
  build:
    name: Build, run in simulator, screenshots
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen >/dev/null
          cd ios && xcodegen generate

      - name: Build for simulator
        run: |
          mkdir -p out
          cd ios
          set +e
          xcodebuild -project Hifz.xcodeproj -scheme Hifz -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ../build/sim CODE_SIGNING_ALLOWED=NO build > ../out/build-sim.log 2>&1
          code=$?
          set -e
          grep -E "(error|warning): " ../out/build-sim.log | grep -v "/build/sim/" | sort -u | head -40 | while IFS= read -r line; do
            case "$line" in *error:*) echo "::error::${line}";; *) echo "::warning::${line}";; esac
          done
          tail -5 ../out/build-sim.log
          exit $code

      - name: Run in simulator and take screenshots
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          c = [x for k, v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone') and 'Pro' in x['name'] and 'Max' not in x['name']]
          c = c or [x for k, v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]
          print(c[-1]['udid'])")
          echo "::notice::Simulator $(xcrun simctl list devices | grep $UDID | head -1 | xargs)"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b > /dev/null
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 || true
          xcrun simctl install "$UDID" build/sim/Build/Products/Debug-iphonesimulator/Hifz.app
          shot() {
            name="$1"; js="$2"; wait="$3"
            xcrun simctl launch --terminate-running-process "$UDID" "$BUNDLE_ID" -hifzDebugJS "$js" > /dev/null
            sleep "$wait"
            xcrun simctl io "$UDID" screenshot "out/$name.png" > /dev/null 2>&1
          }
          DIAG='setTimeout(function(){ toast("native=" + (window.HIFZ_NATIVE ? HIFZ_NATIVE.version : "нет") + " · voice=" + VOICE + " · audio=" + AUDIO); }, 300)'
          shot 01-home "$DIAG" 22
          shot 02-reader 'openReader(112,1)' 16
          shot 03-listen 'openReader(112,1); setTimeout(function(){ listenSheet(true) }, 2500)' 18
          shot 04-learn 'goTab("learn")' 14
          shot 05-drill 'goTab("learn"); setTimeout(function(){ var b = document.querySelector("#start-btn"); if (b) b.click(); }, 1500)' 18
          xcrun simctl privacy "$UDID" grant microphone "$BUNDLE_ID" || true
          shot 06-mic 'startDrill(112,1,4); setTimeout(function(){ document.querySelector("#d-mic").click(); }, 2000)' 16
          xcrun simctl spawn "$UDID" log show --last 3m --predicate 'process == "Hifz"' --style compact 2>/dev/null | tail -200 > out/app.log || true

      - name: Unsigned IPA (for installing with a free Apple ID)
        run: |
          cd ios
          xcodebuild -project Hifz.xcodeproj -scheme Hifz -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath ../build/dev \
            CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION=${{ github.run_number }} build > ../out/build-device.log 2>&1 || { grep -E "error: " ../out/build-device.log | sort -u | head -20 | sed 's/^/::error::/'; exit 1; }
          cd ..
          mkdir -p ipa/Payload && cp -R build/dev/Build/Products/Release-iphoneos/Hifz.app ipa/Payload/
          (cd ipa && zip -qry ../out/Hifz-unsigned.ipa Payload)
          ls -la out

      - name: Publish screenshots and logs to the ios-ci branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out && cd out
          echo "run ${{ github.run_number }} · ${{ github.sha }}" > RUN.txt
          git init -q -b ios-ci
          git add -A
          git -c user.name="ios-ci" -c user.email="ios-ci@users.noreply.github.com" commit -qm "run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ios-ci

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hifz-ios-${{ github.run_number }}
          path: out

  testflight:
    name: Sign and upload to TestFlight
    needs: build
    runs-on: macos-26
    timeout-minutes: 40
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
    steps:
      - name: Check Apple keys
        id: keys
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ] && [ -n "$TEAM_ID" ]; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Ключи Apple ещё не добавлены в секреты репозитория — загрузка в TestFlight пропущена."
          fi

      - uses: actions/checkout@v4
        if: steps.keys.outputs.ok == '1'

      - name: Prepare
        if: steps.keys.outputs.ok == '1'
        run: |
          brew install xcodegen >/dev/null
          (cd ios && xcodegen generate)
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          python3 -m venv /tmp/asc && /tmp/asc/bin/pip -q install pyjwt cryptography requests
          /tmp/asc/bin/python tools/asc.py prepare

      - name: Archive and upload
        if: steps.keys.outputs.ok == '1'
        run: |
          KEY=~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          sed "s/__TEAM_ID__/$TEAM_ID/" ios/ExportOptions.plist > /tmp/ExportOptions.plist
          mkdir -p out
          report() { grep -E "error: |Error Domain|failed|No profiles|requires a provisioning|ITMS-" "$1" | sort -u | head -25 | sed 's/^/::error::/'; }
          set +e
          xcodebuild -project ios/Hifz.xcodeproj -scheme Hifz -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/Hifz.xcarchive DEVELOPMENT_TEAM=$TEAM_ID CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} $AUTH archive > out/archive.log 2>&1
          if [ $? -ne 0 ]; then report out/archive.log; tail -30 out/archive.log; exit 1; fi
          xcodebuild -exportArchive -archivePath build/Hifz.xcarchive -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath build/export $AUTH > out/export.log 2>&1
          if [ $? -ne 0 ]; then report out/export.log; tail -40 out/export.log; exit 1; fi
          echo "::notice::Сборка ${{ github.run_number }} загружена в App Store Connect. Через 10–30 минут она появится в TestFlight."

      - name: TestFlight group
        if: steps.keys.outputs.ok == '1'
        run: /tmp/asc/bin/python tools/asc.py testflight ${{ github.run_number }}
