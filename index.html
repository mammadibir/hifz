<style>
/* Layout: one-screen app. Three tab views over a bottom tab bar; the reader and the memorization drill take over the whole screen. */
:root{
  --paper:#F3F4F8; --surface:#FFFFFF; --ink:#151A2A; --muted:#5B6378; --line:#DADFEA;
  --lapis:#2A4AA2; --on-lapis:#FFFFFF; --lapis-soft:#E3E8F6;
  --gold:#A3741A; --gold-soft:#F3E8CF;
  --ok:#1C8350; --ok-soft:#DCF0E3; --err:#C0382A; --err-soft:#F8DFDA; --veil:#DCE1ED;
  --shadow:0 1px 2px rgba(21,26,42,.06),0 8px 24px rgba(21,26,42,.06);
  --f-quran:"Amiri Quran","Amiri","Scheherazade New","Noto Naskh Arabic","Geeza Pro",serif;
  --f-display:"Alegreya",Georgia,"Times New Roman",serif;
  --f-ui:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --qsize:28px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0C111D; --surface:#141B2B; --ink:#E7EAF2; --muted:#949CB1; --line:#243049;
  --lapis:#93ABF3; --on-lapis:#0C111D; --lapis-soft:#1C2742;
  --gold:#D8B060; --gold-soft:#2D2716;
  --ok:#53C58E; --ok-soft:#132E1F; --err:#F27B6C; --err-soft:#3A1B18; --veil:#222B43;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0C111D; --surface:#141B2B; --ink:#E7EAF2; --muted:#949CB1; --line:#243049;
  --lapis:#93ABF3; --on-lapis:#0C111D; --lapis-soft:#1C2742;
  --gold:#D8B060; --gold-soft:#2D2716;
  --ok:#53C58E; --ok-soft:#132E1F; --err:#F27B6C; --err-soft:#3A1B18; --veil:#222B43;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.45 var(--f-ui);overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--lapis);outline-offset:2px;border-radius:6px}
.ar{font-family:var(--f-quran);direction:rtl}

#app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto;background:var(--paper)}
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.pad{padding-inline:16px;padding-block:4px 28px;display:flex;flex-direction:column;gap:18px}

/* Top bars */
.top{display:flex;align-items:center;gap:12px;padding-inline:16px;padding-block:14px 10px}
.brand{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.brand-mark{font-family:var(--f-quran);font-size:26px;line-height:1;color:var(--gold);width:44px;height:44px;display:grid;place-items:center;border:1.5px solid var(--gold);border-radius:12px;padding-bottom:4px}
.brand h1{margin:0;font:700 22px/1.1 var(--f-display);letter-spacing:.2px}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink);flex:none}
.icon-btn:hover{background:var(--lapis-soft)}
.icon-btn svg{width:22px;height:22px}
.bar{display:flex;align-items:center;gap:6px;padding-inline:8px;padding-block:8px;border-bottom:1px solid var(--line);background:var(--surface)}
.bar-title{flex:1;min-width:0;text-align:center}
.bar-title b{display:block;font:700 17px/1.2 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-title small{display:block;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}

h2.sec{margin:0;font:700 19px/1.2 var(--f-display);text-wrap:balance}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}

/* Cards */
.card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:16px}
.today{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:84px;height:84px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bg{stroke:var(--veil)} .ring .fg{stroke:var(--gold);transition:stroke-dashoffset .5s}
.ring-num{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.05}
.ring-num b{font:700 22px var(--f-display);font-variant-numeric:tabular-nums}
.ring-num small{display:block;font-size:10.5px;color:var(--muted)}
.today-txt{display:flex;flex-direction:column;gap:6px;min-width:0}
.today-txt .h{font:700 17px/1.25 var(--f-display)}
.stat-line{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.stat-line b{color:var(--ink);font-variant-numeric:tabular-nums}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 14px;border-radius:14px;font-weight:600;font-size:14.5px;text-align:center;line-height:1.2}
.btn svg{width:18px;height:18px;flex:none}
.btn-primary{background:var(--lapis);color:var(--on-lapis)}
.btn-soft{background:var(--lapis-soft);color:var(--lapis)}
.btn-line{border:1.5px solid var(--line);background:var(--surface)}
.btn-danger{background:var(--err);color:var(--surface)}
a.btn{text-decoration:none;color:inherit}
.btn small{display:block;font-weight:500;font-size:11.5px;opacity:.85}
.btn-col{flex-direction:column;gap:2px}

/* Search + segmented */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding-inline:12px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;padding-block:12px;font-size:15px}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--veil);border-radius:12px;padding:3px;gap:2px}
.seg button{padding:7px 14px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.list-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* Surah rows */
.list{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.srow{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow:hover{background:var(--lapis-soft)}
.sname{min-width:0}
.sname b{display:block;font-weight:600;font-size:15px}
.sname small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sar{font-family:var(--f-quran);font-size:21px;color:var(--ink);direction:rtl;line-height:1.3}
.minibar{display:block;height:3px;border-radius:2px;background:var(--veil);margin-top:6px;overflow:hidden;max-width:140px}
.minibar i{display:block;height:100%;background:var(--gold)}
.star{position:relative;width:36px;height:36px;display:grid;place-items:center;font:600 12px var(--f-ui);color:var(--lapis);font-variant-numeric:tabular-nums}
.star::before,.star::after{content:"";position:absolute;inset:6px;border:1.5px solid var(--gold);border-radius:3px}
.star::after{transform:rotate(45deg)}
.star.done{color:var(--gold)}
.star.done::before,.star.done::after{background:var(--gold-soft)}
.star span{position:relative;z-index:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-size:13.5px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--lapis-soft);border-color:var(--lapis);color:var(--lapis)}
.empty{padding:22px 16px;text-align:center;color:var(--muted)}

/* Tabs */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-top:1px solid var(--line)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding-block:9px 8px;font-size:11.5px;font-weight:600;color:var(--muted)}
.tabs svg{width:23px;height:23px}
.tabs button[aria-current="page"]{color:var(--lapis)}

/* Reader */
.surah-head{text-align:center;padding-block:22px 6px;display:flex;flex-direction:column;align-items:center;gap:4px}
.sh-frame{border:1.5px solid var(--gold);border-radius:14px;padding:6px 26px 10px;position:relative;background:var(--surface)}
.sh-frame::before,.sh-frame::after{content:"";position:absolute;top:50%;width:10px;height:10px;border:1.5px solid var(--gold);background:var(--paper);transform:translateY(-50%) rotate(45deg)}
.sh-frame::before{left:-6px} .sh-frame::after{right:-6px}
.sh-ar{font-family:var(--f-quran);font-size:30px;line-height:1.6;direction:rtl}
.sh-ru{color:var(--muted);font-size:13px}
.bism{font-family:var(--f-quran);font-size:calc(var(--qsize) * .95);text-align:center;direction:rtl;line-height:2;padding-block:4px 6px}
.mpage{padding-inline:16px;padding-block:6px 4px}
.mushaf{font-family:var(--f-quran);font-size:var(--qsize);line-height:2.15;direction:rtl;text-align:justify;text-align-last:center;margin:0;word-spacing:.04em}
.ayah{border-radius:8px;cursor:pointer;transition:background .2s}
.ayah:hover{background:var(--lapis-soft)}
.ayah.flash,.vcard.flash{background:var(--gold-soft)}
.am{display:inline-grid;place-items:center;min-width:1.55em;height:1.55em;padding-inline:.18em;margin-inline:.15em;border:1.5px solid var(--gold);border-radius:50%;color:var(--gold);font-family:var(--f-quran);font-size:.62em;line-height:1;vertical-align:.18em;font-variant-numeric:tabular-nums}
.am.learned{background:var(--gold);color:var(--surface)}
.am.prog{background:var(--gold-soft)}
.sajda{color:var(--gold);font-size:.8em;margin-inline-start:.1em}
.pfoot{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;padding-block:10px 4px;font-variant-numeric:tabular-nums}
.pfoot::before,.pfoot::after{content:"";flex:1;height:1px;background:var(--line)}
.vlist{display:flex;flex-direction:column;gap:12px;padding-inline:16px;padding-block:8px}
.vcard{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;transition:background .3s}
.vhead{display:flex;align-items:center;gap:8px}
.vref{font-size:12px;font-weight:600;color:var(--lapis);background:var(--lapis-soft);border-radius:8px;padding:3px 8px;font-variant-numeric:tabular-nums}
.vhead .sp{flex:1}
.vstate{font-size:11.5px;color:var(--gold);font-weight:600}
.vmore{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.vmore svg{width:18px;height:18px}
.vcard .ar{font-size:var(--qsize);line-height:2.05;margin:0;text-align:right}
.vcard .tr{margin:0;color:var(--ink);font-size:14.5px;line-height:1.55;max-width:65ch}
.reader-end{display:flex;gap:10px;padding-inline:16px;padding-block:18px 30px}
.reader-end .btn{flex:1}
.loading{padding:40px 16px;text-align:center;color:var(--muted)}
.ayah.playing{background:var(--lapis-soft);box-shadow:inset 0 -2px 0 var(--lapis)}
.vcard.playing{box-shadow:0 0 0 2px var(--lapis),var(--shadow)}
.dverse.playing{background:var(--lapis-soft);border-radius:12px}
.player{display:grid;grid-template-columns:48px 1fr auto 40px;align-items:center;gap:8px;padding-inline:10px;padding-block:8px;background:var(--surface);border-top:1px solid var(--line)}
.pbtn{width:48px;height:48px;border-radius:50%;background:var(--lapis);color:var(--on-lapis);display:grid;place-items:center}
.pbtn svg{width:22px;height:22px}
.pinfo{min-width:0;text-align:left;display:flex;flex-direction:column}
.pinfo b{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinfo small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pchip{min-width:44px;height:34px;padding-inline:10px;border-radius:10px;background:var(--gold-soft);color:var(--gold);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.icon-btn.on{background:var(--lapis);color:var(--on-lapis)}
.rlist{display:flex;flex-direction:column;border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.rrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;font-size:14.5px}
.rrow:last-child{border-bottom:0}
.rrow i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none}
.rrow[aria-pressed="true"]{background:var(--lapis-soft)}
.rrow[aria-pressed="true"] i{border:5px solid var(--lapis)}
.show-all .w.hid{color:var(--muted);background:none}
.show-all .w.cur{color:var(--ink);background:var(--lapis-soft)}
.mic-hint{display:flex;gap:10px;align-items:center;background:var(--lapis-soft);color:var(--ink);border-radius:14px;padding:10px 12px;font-size:13.5px;line-height:1.4}
.mic-hint svg{width:22px;height:22px;color:var(--lapis);flex:none}

/* Drill */
.pline{height:3px;background:var(--veil)}
.pline i{display:block;height:100%;width:0;background:var(--lapis);transition:width .25s}
.dbody{padding-inline:16px;padding-block:14px 30px;display:flex;flex-direction:column;gap:6px}
.dverse{padding-block:6px;border-bottom:1px dashed var(--line)}
.dverse:last-child{border-bottom:0}
.dverse .ar{font-size:var(--qsize);line-height:2.25;margin:0;text-align:right}
.cue{margin:0;color:var(--muted);font-size:13.5px;line-height:1.5}
.w{border-radius:7px;padding-inline:.06em;transition:color .2s,background .2s;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.w.hid{color:transparent;background:var(--veil);user-select:none;-webkit-user-select:none}
.w.cur{background:var(--lapis-soft);box-shadow:inset 0 -3px 0 var(--lapis)}
.w.err{color:var(--err);background:var(--err-soft)}
.w.ok.fresh{background:var(--ok-soft)}
.w.giv{color:var(--muted)}
.ctl{display:grid;grid-template-columns:48px 1fr 1.35fr 48px;gap:8px;padding-inline:12px;padding-block:10px 12px;background:var(--surface);border-top:1px solid var(--line)}
.ctl.has-mic{grid-template-columns:48px 1fr 56px 1fr 48px}
.cbtn{min-height:56px;border-radius:16px;font-weight:600;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.1}
.cbtn small{font-size:11px;font-weight:500;opacity:.8}
.cbtn svg{width:22px;height:22px}
.c-ok{background:var(--lapis);color:var(--on-lapis)}
.c-err{background:var(--err-soft);color:var(--err)}
.c-ghost{background:var(--veil);color:var(--ink)}
.c-mic{background:var(--veil);color:var(--ink);border-radius:50%;min-height:56px}
.c-mic.on{background:var(--err);color:var(--surface);animation:pulse 1.6s infinite}
.cbtn:disabled{opacity:.4;cursor:default}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--err) 45%,transparent)}70%{box-shadow:0 0 0 12px transparent}100%{box-shadow:0 0 0 0 transparent}}
.hearing{min-height:20px;padding-inline:16px;padding-block:4px;color:var(--muted);font-size:13px;direction:rtl;text-align:right;font-family:var(--f-quran);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--surface)}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.flabel{font-size:12.5px;font-weight:600;color:var(--muted)}
.select,.num{width:100%;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:11px 12px;font-size:15px}
.range-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.stepper button{height:44px;font-size:20px;color:var(--lapis)}
.stepper input{border:0;text-align:center;background:none;width:100%;min-width:0;font-size:16px;font-variant-numeric:tabular-nums;outline:0;-moz-appearance:textfield}
.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px}
.toggle input{width:44px;height:26px;appearance:none;-webkit-appearance:none;background:var(--veil);border-radius:999px;position:relative;cursor:pointer;flex:none;transition:background .2s}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s}
.toggle input:checked{background:var(--lapis)}
.toggle input:checked::after{transform:translateX(18px)}
.setup{display:flex;flex-direction:column;gap:14px}
.preview-ar{font-family:var(--f-quran);font-size:var(--qsize);direction:rtl;text-align:center;line-height:2;margin:0;border:1px dashed var(--line);border-radius:12px;padding:4px 8px}
input[type=range]{width:100%;accent-color:var(--lapis)}

/* Progress */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font:700 24px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.tile span{font-size:11.5px;color:var(--muted);line-height:1.3}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,auto);grid-auto-columns:1fr;gap:3px;overflow-x:auto}
.heat i{width:100%;aspect-ratio:1;border-radius:3px;background:var(--veil);min-width:12px}
.heat i.l1{background:color-mix(in srgb,var(--lapis) 28%,var(--surface))}
.heat i.l2{background:color-mix(in srgb,var(--lapis) 52%,var(--surface))}
.heat i.l3{background:color-mix(in srgb,var(--lapis) 76%,var(--surface))}
.heat i.l4{background:var(--lapis)}
.heat i.today{outline:1.5px solid var(--gold);outline-offset:1px}
.legend{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);justify-content:flex-end;margin-top:8px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.prow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:11px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.prow:last-child{border-bottom:0}
.prow b{font-weight:600}
.prow .cnt{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.pbar{grid-column:1/-1;display:flex;height:6px;border-radius:3px;background:var(--veil);overflow:hidden}
.pbar .l{background:var(--gold)} .pbar .p{background:color-mix(in srgb,var(--gold) 40%,var(--surface))}
.mrow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.mrow:last-child{border-bottom:0}

/* Sheet & toast */
.sheet-wrap{position:fixed;inset:0;z-index:20;background:rgba(10,14,25,.42);display:flex;align-items:flex-end;justify-content:center}

.errwords{display:flex;flex-wrap:wrap;gap:6px 10px;direction:rtl;font-family:var(--f-quran);font-size:24px;color:var(--err);line-height:1.8}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:500;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
/* Mushaf pages */

.pager{height:100%;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pager::-webkit-scrollbar{display:none}
.mp{flex:0 0 100%;width:100%;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:auto;display:block;padding-inline:12px;padding-block:6px;overscroll-behavior:contain}

.mfoot{display:flex;justify-content:space-between;align-items:center;padding-block:6px 0}

.dpage-body{padding-inline:12px}
.dpage-body .mpg{margin-inline:auto}

.cue-strip{padding-inline:16px;padding-block:8px;background:var(--surface);border-top:1px solid var(--line);color:var(--muted);font-size:13px;line-height:1.45;max-height:4.6em;overflow-y:auto}
/* Past mistakes fade with each correct reading: m5 is fresh, m1 nearly gone */
.w.m5{color:var(--err);background:var(--err-soft)}
.w.m4{color:color-mix(in srgb,var(--err) 80%,var(--ink));background:color-mix(in srgb,var(--err-soft) 75%,transparent)}
.w.m3{color:color-mix(in srgb,var(--err) 60%,var(--ink));background:color-mix(in srgb,var(--err-soft) 50%,transparent)}
.w.m2{color:color-mix(in srgb,var(--err) 40%,var(--ink));background:color-mix(in srgb,var(--err-soft) 30%,transparent)}
.w.m1{color:color-mix(in srgb,var(--err) 22%,var(--ink));background:color-mix(in srgb,var(--err-soft) 14%,transparent)}

.mframe .w.hid{background:linear-gradient(transparent 22%,var(--veil) 22% 78%,transparent 78%)}

.mframe .w.err,.mframe .w.m5{background:linear-gradient(transparent 22%,var(--err-soft) 22% 78%,transparent 78%)}
.mframe .w.m4{background:linear-gradient(transparent 22%,color-mix(in srgb,var(--err-soft) 75%,transparent) 22% 78%,transparent 78%)}
.mframe .w.m3{background:linear-gradient(transparent 22%,color-mix(in srgb,var(--err-soft) 50%,transparent) 22% 78%,transparent 78%)}
.mframe .w.m2{background:linear-gradient(transparent 22%,color-mix(in srgb,var(--err-soft) 30%,transparent) 22% 78%,transparent 78%)}
.mframe .w.m1{background:linear-gradient(transparent 22%,color-mix(in srgb,var(--err-soft) 14%,transparent) 22% 78%,transparent 78%)}
.mframe .w.ok.fresh{background:linear-gradient(transparent 22%,var(--ok-soft) 22% 78%,transparent 78%)}
.show-all .mframe .w.hid{background:none}
.show-all .mframe .w.cur{background:linear-gradient(transparent 22%,var(--lapis-soft) 22% 72%,var(--lapis) 72% 78%,transparent 78%)}
.icon-btn.aa{font:700 16px/1 var(--f-display);letter-spacing:.02em}

    for (let d = 1; d <= 4 && p - d >= 0; d++){ rep = tryMatch(items[p - d], toks, t); if (rep) break; }

    if (final || t < toks.length - 2){ marks.push([p, 2]); p++; t++; continue; }

/* ---------- voice (works when the page is opened directly in Chrome/Safari) ---------- */
let rec = null, vbase = null, listening = false;
function startVoice(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR || !D) return;
  if (P.s) pStop();
  rec = new SR(); rec.lang = "ar-SA"; rec.continuous = true; rec.interimResults = true; rec.maxAlternatives = 1;
  listening = true; D.voiceUsed = true; let starts = 0;
  $("#d-mic").classList.add("on"); $("#d-hear").hidden = false; $("#d-hear").textContent = "Слушаю… начните читать";
  const begin = () => { vbase = { start: D.cur > 0 ? D.test[D.cur - 1] + 1 : 0, cur: D.cur, st: D.st.slice(), touched: [], skip: 0, seen: 0 }; };
  begin();
  rec.onstart = () => { starts++; };
  rec.onresult = e => {
    // Some browsers resend the whole utterance in every result; keep the longest version instead of appending duplicates.
    let txt = "", fin = true;
    for (let i = 0; i < e.results.length; i++){
      const t = e.results[i][0].transcript.trim(); if (!e.results[i].isFinal) fin = false; if (!t) continue;
      const nt = toTokens(t).join(" "), nx = toTokens(txt).join(" ");
      if (nx && nt.startsWith(nx)) txt = t; else if (nx && nx.endsWith(nt)) continue; else txt += " " + t;
    }
    $("#d-hear").textContent = txt.trim() || "…";
    const all = toTokens(txt); vbase.seen = all.length;
    const toks = all.slice(vbase.skip);
    const pending = new Set(); for (const i of D.test) if (vbase.st[i] === 4) pending.add(i);
    const { marks } = runMatch(D.items, vbase.start, toks, fin, S.set.strict, pending);
    D.st = vbase.st.slice();
    const touched = new Set(vbase.touched);
    let newErr = false;
    for (const [i, st] of marks){
      if (!D.items[i].test) continue;
      D.st[i] = st; touched.add(i);
      if ((st === 2 || st === 4) && !D.alerted.has(i)){ D.alerted.add(i); newErr = true; }
    }
    vbase.touched = [...touched];
    if (newErr) feedbackError();
    const prevCurIdx = D.test[D.cur]; D.cur = firstPending();
    paint([...touched, prevCurIdx, D.test[D.cur]].filter(i => i != null));
    updateDrillHeader(); scrollCur();
    if (D.cur >= D.test.length){ stopVoice(); finishDrill(); }
  };
  rec.onerror = e => {
    if (e.error === "no-speech" || e.error === "aborted") return;
    listening = false;
    const denied = e.error === "not-allowed" || e.error === "service-not-allowed";
    toast(denied && starts > 1 ? "Микрофон выключился. Нажмите на него, чтобы продолжить." : denied ? "Нет доступа к микрофону. Разрешите его для этого сайта в настройках браузера." : e.error === "network" ? "Для распознавания речи нужен интернет." : e.error === "language-not-supported" ? "Браузер не распознаёт арабский язык. На iPhone включите диктовку в Настройки → Основные → Клавиатура." : "Распознавание речи остановилось. Нажмите на микрофон, чтобы продолжить.");
  };
  rec.onend = () => {
    if (listening && D && D.cur < D.test.length){
      pushVoiceHist();
      begin(); try { rec.start(); } catch (e) { stopVoice(); }
    } else stopVoice();
  };
  try { rec.start(); } catch (e) { stopVoice(); toast("Не удалось включить микрофон."); }
}
function pushVoiceHist(){
  if (!D || !vbase) return;
  const g = vbase.touched.filter(i => vbase.st[i] !== D.st[i]).sort((a, b) => a - b).map(i => [i, vbase.st[i]]);
  if (g.length) D.hist.push(g);
}
/* A button press while listening: keep what was marked and match only speech that comes after it. */
function rebaseVoice(){
  if (!rec || !vbase || !D) return;
  pushVoiceHist();
  const seen = vbase.seen;
  vbase = { start: D.cur > 0 ? D.test[D.cur - 1] + 1 : 0, cur: D.cur, st: D.st.slice(), touched: [], skip: seen, seen };
}
function stopVoice(){
  listening = false;
  if (rec){ const r = rec; rec = null; r.onend = null; r.onresult = null; try { r.abort(); } catch (e) {}
    pushVoiceHist(); }
  vbase = null;
  $("#d-mic").classList.remove("on"); $("#d-hear").hidden = true;
  if (D) updateDrillHeader();
}

    case "toggle-layout": { S.set.layout = S.set.layout === "mushaf" ? "verses" : "mushaf"; save(); const L = S.last || { s: 1, v: 1 }; openReader(L.s, L.v); break; }
    case "page-go": if (PG) goPage(PG.cur + +d.d, true); break;
    case "page-retry": if (PG) fillPage(+d.p); break;
    case "verse": if (R) verseSheet(R.s, +d.v); break;
    case "toggle-learned": { const k = d.s + ":" + d.v, x = S.vp[k] || [0, 0, 0]; if (x[0] >= 3) x[0] = 0; else x[0] = 3; x[1] = dnum(); S.vp[k] = x; save(); closeSheet(); refreshReader(); toast(x[0] >= 3 ? "Отмечен как выученный" : "Отметка снята"); break; }
    case "toggle-bm": { const k = d.s + ":" + d.v; S.bm = S.bm.includes(k) ? S.bm.filter(x => x !== k) : [k, ...S.bm].slice(0, 30); save(); closeSheet(); refreshReader(); toast(S.bm.includes(k) ? "Добавлено в закладки" : "Закладка удалена"); break; }
    case "copy": { const s = +d.s, v = +d.v, dd = SC[s]; if (!dd) break; const txt = `${dd.a[v-1].join(" ")}\n\n${dd.t[v-1]}\n— ${sName(s)}, ${s}:${v}`; try { navigator.clipboard.writeText(txt).then(() => toast("Скопировано"), () => toast("Не удалось скопировать")); } catch (err) { toast("Не удалось скопировать"); } break; }
    case "drill-from": { closeSheet(); const s = +d.s || (R && R.s) || 1, f = +d.v, n = CNT(s); startDrill(s, f, Math.min(n, f + (n - f + 1 > 10 ? 4 : n - f))); break; }
    case "drill": closeSheet(); startDrill(+d.s, +d.f, +d.t); break;
    case "drill-done": closeDrill(); break;
    case "close-drill": closeDrill(); break;
    case "drill-restart": if (D) { const { kind, p, s, f, t } = D; if (kind === "page") startPageDrill(p); else startDrill(s, f, t); } break;
    case "drill-page": closeSheet(); startPageDrill(+d.p); break;
    case "learn-page": if (PG) startPageDrill(PG.cur); break;
    case "lmode": readSetup(); setup.mode = d.k; renderLearn(); break;
    case "pstep": { readSetup(); setup.p = Math.max(1, Math.min(604, setup.p + +d.d)); const [ps, pv] = pageFirst(setup.p); setup.s = ps; setup.f = pv; setup.t = Math.min(CNT(ps), pv + 4); syncSetupUI(); break; }
    case "d-ok": mark(1); break;
    case "d-err": mark(2); break;
    case "d-verse": markVerse(); break;
    case "d-undo": undo(); break;
    case "d-mic": unlockAudio(); if (rec) stopVoice(); else startVoice(); break;
    case "fb": S.set.fb = d.k; save(); $$("[data-act=fb]").forEach(b => b.setAttribute("aria-pressed", b.dataset.k === d.k)); unlockAudio(); feedbackError(); break;
    case "hide": S.set.hide = d.k; save(); $$("[data-act=hide]").forEach(b => b.setAttribute("aria-pressed", b.dataset.k === d.k)); break;
    case "pick": setup = { mode: (setup && setup.mode) || "range", s: +d.s, f: 1, t: Math.min(CNT(+d.s), 7), p: pageOf(+d.s, 1) }; syncSetupUI(); break;
    case "step": { readSetup(); const n = CNT(setup.s); setup[d.k] = Math.max(1, Math.min(n, setup[d.k] + +d.d)); if (setup.t < setup.f) { if (d.k === "f") setup.t = setup.f; else setup.f = setup.t; } syncSetupUI(); break; }
    case "start-drill": { const x = readSetup(); if (x.mode === "page") startPageDrill(x.p); else startDrill(x.s, x.f, x.t); break; }
    case "list": break;
  }
});
document.addEventListener("click", e => {
  const b = e.target.closest("[data-list]"); if (!b) return;
  listMode = b.dataset.list; $$("[data-list]").forEach(x => x.setAttribute("aria-pressed", x === b)); $("#list-title").textContent = listMode === "juz" ? "Джузы" : "Суры"; renderList();
});
document.addEventListener("input", e => {
  if (e.target.id === "q"){ query = e.target.value; renderList(); }
  else if (e.target.id === "fs"){ S.set.fs = +e.target.value; $("#fs-val").textContent = S.set.fs; applySettings(); }
  else if (e.target.id === "lcue"){ S.set.cue = e.target.checked; save(); }
  else if (e.target.id === "lstrict"){ S.set.strict = e.target.checked; save(); }
});
document.addEventListener("change", e => {
  if (e.target.id === "fs") save();
  else if (e.target.id === "ls"){ const s = +e.target.value, n = CNT(s); let f = 1; for (let v = 1; v <= n; v++){ if (!isLearned(s, v)){ f = v; break; } } setup = { mode: setup.mode, s, f, t: Math.min(n, f + Math.min(4, n - f)), p: pageOf(s, setup.mode === "page" ? 1 : f) }; syncSetupUI(); }
  else if (e.target.id === "lf" || e.target.id === "lt"){ readSetup(); setup.p = pageOf(setup.s, setup.f); syncSetupUI(); }
  else if (e.target.id === "lp"){ readSetup(); const [s, v] = pageFirst(setup.p); setup.s = s; setup.f = v; setup.t = Math.min(CNT(s), v + 4); syncSetupUI(); }
});
document.addEventListener("submit", e => {
  if (e.target.id === "acc-form" || e.target.id === "fam-form"){ e.preventDefault(); onAccountSubmit(e.target); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("#sheet").hidden){ closeSheet(); return; }
  if (overlay === "drill" && $("#sheet").hidden && !e.target.closest("input,select")){
    if (e.key === "ArrowLeft" || e.key === " " ){ e.preventDefault(); mark(1); }
    else if (e.key === "ArrowRight" || e.key === "x"){ e.preventDefault(); mark(2); }
    else if (e.key === "Backspace"){ e.preventDefault(); undo(); }
  }
});
$("#r-scroll").addEventListener("scroll", onReaderScroll, { passive: true });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden"){ Remote.flush(); Cloud.flush(); } else if (overlay === "drill" && D && !wake) navigator.wakeLock?.request("screen").then(w => wake = w, () => {}); });

function renderAll(){
  refreshReader();
  if (tab === "home") renderHome(); else if (tab === "learn"){ setup = setup || null; renderLearn(); } else renderProgress();
}

/* ---------- boot ---------- */
loadLocal(); applySettings(); renderSyncNote(); goTab("home");
attachPinch($("#r-scroll")); attachPinch($("#d-scroll"));
Remote.init();
Cloud.init();
</script>
